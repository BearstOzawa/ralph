name: 🐺 Ralph Nightly — Scan ai/ready Issues

# Runs nightly at UTC 16:00 (midnight Beijing time)
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  scan-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: write
    steps:
      - name: Find ai/ready issues and trigger Ralph
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ai/ready',
              state: 'open',
              per_page: 10
            });

            console.log(`Found ${issues.data.length} issues with ai/ready label`);

            for (const issue of issues.data) {
              console.log(`Dispatching Ralph for issue #${issue.number}: ${issue.title}`);

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ralph.yml',
                ref: 'main',
                inputs: {
                  issue_number: String(issue.number),
                  backend: process.env.RALPH_DEFAULT_BACKEND || 'llm'
                }
              });

              // Stagger dispatches to avoid rate limits
              await new Promise(r => setTimeout(r, 5000));
            }

            if (issues.data.length === 0) {
              console.log('No issues to process. Ralph is sleeping too 💤');
            }
